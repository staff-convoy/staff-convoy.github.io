.regopt input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.regopt b{display:block;font-size:17px}
.regopt:has(input:checked){border-color:var(--accent);background:rgba(255,210,31,.12)}
.regopt.off{opacity:.4;cursor:not-allowed}
.regdone{border:2px solid var(--ok);border-radius:12px;padding:14px;font-size:17px}
.stlayout{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;grid-template-areas:"side main me";gap:18px;align-items:start}
.stlayout>.stside{grid-area:side}.stlayout>section{grid-area:main}.stlayout>.stme{grid-area:me}
.stside,.stme{position:sticky;top:112px}
.stme .card{display:flex;flex-direction:column;gap:10px;border-color:var(--accent)}
.stme img{width:100%;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:zoom-in}
@media (max-width:1250px){.stlayout{grid-template-columns:290px minmax(0,1fr);grid-template-areas:"me main" "side main"}.stside,.stme{position:static}}
@media (max-width:820px){.stlayout{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side"}
  /* phone: a small ID card that stays on the right while scrolling; tap to open it big */
  .stme{position:fixed;right:10px;bottom:14px;top:auto;width:118px;z-index:30}
  .stme .card{padding:6px;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .stme .panelh{font-size:10px;text-align:center}
  .stme .stmeinfo{display:none}
  .stme img{border-radius:6px}
  .stme .cvthumb{font-size:10px;min-height:60px}}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stcard{display:flex;flex-direction:column;gap:8px}
.stcard.me{border-color:var(--accent)}
.notice{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.notice.shut{background:#d32f2f;color:#fff}
.yn{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:100;padding:16px}
.ynbox{background:var(--bg);border:2px solid var(--accent);border-radius:16px;padding:20px;max-width:380px;width:100%}
.carhead{display:flex;align-items:center;gap:10px;margin:6px 0 2px;padding:6px 12px;border-left:4px solid var(--accent);background:rgba(255,255,255,.04);border-radius:6px;font-size:15px}
.plate{background:var(--accent);color:var(--accent-ink);font:800 13px/1 var(--f-mono);padding:5px 8px;border-radius:6px;white-space:nowrap}
.notice b{font:800 14px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase}
/* the group on days with no convoy: only the ID card pictures, nothing around them */
.grpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
@media (max-width:600px){.grpgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.grpid{border-radius:5px}}
.grpid{display:block;width:100%;aspect-ratio:1.55;object-fit:cover;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.grpid.none{display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px dashed var(--line);color:var(--muted);font-size:13px;box-shadow:none;text-align:center;padding:8px}
.grpid.me{outline:3px solid var(--accent);outline-offset:3px}
.rowrap{border:1px solid var(--line);border-radius:10px;overflow:auto}
.ro{width:100%;min-width:520px;border-collapse:collapse;font-size:14px;table-layout:fixed}
.ro th,.ro td{padding:9px 12px;text-align:left;border-right:1px solid var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro th:last-child,.ro td:last-child{border-right:0}
.ro tr:last-child td{border-bottom:0}
.ro th{background:var(--accent);color:var(--accent-ink);font:800 12px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
.ro tr:nth-child(even) td{background:var(--sunk)}
.ro td.no{text-align:center;font-family:var(--f-mono);color:var(--accent);font-weight:600}
.ro td.nm{font-weight:700}
.ro td.pl{font-family:var(--f-mono)}
.hist .card{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;z-index:60;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <span></span>
      <div class="title"><div class="team" aria-hidden="true"><svg viewBox="0 0 48 32"><circle cx="11" cy="11" r="5"/><circle cx="37" cy="11" r="5"/><path d="M1 30c0-6 4.5-10 10-10 3 0 5.5 1.2 7.2 3.2A13 13 0 0 0 15 30z"/><path d="M47 30c0-6-4.5-10-10-10-3 0-5.5 1.2-7.2 3.2A13 13 0 0 1 33 30z"/><circle cx="24" cy="9" r="6.5"/><path d="M12 31c0-7.5 5.4-13 12-13s12 5.5 12 13z"/><path class="hand" d="M17 21.5c1.6 1.8 4 2.8 7 2.8s5.4-1 7-2.8"/></svg></div>
        <div><h1>Ain Ebel - Rmeich - Debel <span>Critical Staff</span></h1><div class="sub">Naqoura - Sector West · v47</div></div></div>
      <div class="me" id="me"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<main class="wrap" id="view"><div class="empty"><b>Loading</b>Connecting to the team database.</div></main>

<script>
/* ---------- setup ---------- */
const CFG = window.EU_CONFIG || {};
const OWNER = String(CFG.ownerEmail || '').toLowerCase();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const shiftYm = (m, k) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + k, 1)); };
const ymLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'}); };
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function ago(ms){ if(!ms) return ''; const s=(Date.now()-ms)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' h ago';
  return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function toast(msg, urgent){ const t=document.createElement('div'); t.className='toast'+(urgent?' u':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),urgent?10000:4000); }
function isoDay(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function remember(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

// only Convoy and Notes are shown on this page; the other tabs stay on the original Electrical Unit page
const TABS = [['convoy','Convoy'],['notes','Notes']];
const OWNER_TABS = ['convoy'];
const VIEWER = 'farah12+convoystaff@un.org', VIEWER_USER = 'staff';
// each staff member signs in with their ID number (CIV228370) and its numbers as password (228370);
// the account sits on the supervisor's own address, so nothing is ever sent to the staff member
const STAFF_RE = /^\s*([a-z]{2,5})[\s-]*(\d{4,})\s*$/i;
const loginOfId = id => { const m = String(id || '').match(STAFF_RE); return m ? m[1].toLowerCase() + m[2] : ''; };
const staffEmail = login => 'farah12+' + login + '@un.org';
const isStaffEmail = e => /^farah12\+[a-z]+\d+@un\.org$/.test(e);
const loginEmail = v => { const t = v.trim(); if (t.toLowerCase() === VIEWER_USER) return VIEWER; const l = loginOfId(t); return l ? staffEmail(l) : t; };
// a password typed as the whole ID (CIV228370) still works
const loginPass = (u, pw) => { const l = loginOfId(u); return l && loginOfId(pw) === l ? l.replace(/\D/g, '') : pw; };
const regHash = () => (location.hash.match(/reg=(\d{4}-\d{2}-\d{2})/) || [])[1] || '';
const STATUS = {new:'New', progress:'In progress', waiting:'Waiting parts', done:'Done'};
const MARKS = [['P','Present'],['A','Absent'],['L','Leave'],['S','Sick'],['O','Off']];

const S = { user:null, email:'', owner:false, me:null, team:{}, attendance:{}, notes:[], loaded:false,
  tab: remember('eu.tab') || 'convoy', orders:[], support:[], orderFilter:'open', supportFilter:'pending', openSupportId:null, openOrder:null, month: ym(new Date()), noteFilter:'pending', sites:[], readings:{}, kMonth: ym(new Date()), kFind:'', authMode:'signin', authMsg:'',
  cvStaff:[], cvLoaded:false, cvCards:{}, cv:{date:'', direction:''}, cvCars:[], cvTrip: remember('eu.cvTrip') || '', cvDays:{}, cvCal:false, cvDate: isoDay(new Date()), cvMonth: isoDay(new Date()).slice(0, 7), cvInfoLoaded:false, cvNotes:[], cvMeta:{}, cvEscorts:null, cvConvs:{}, cvRegs:{}, cvRegsLoaded:false, cvLogins:null, member:false, login:'', profile:null, profileLoaded:false, regDate: regHash(), stCards:{}, cvSecs:null, cvSec:'', cvOnly:false, cvQuery:'', cvBusy:false };
let cvCardsOn = false;

if (!CFG.firebase || !CFG.firebase.apiKey) {
  $('#view').innerHTML = `<div class="gate stack"><h2>Setup needed</h2><p class="muted">Open <b>config.js</b> and paste your Firebase settings and your own email, as the setup guide explains.</p></div>`;
  throw new Error('config.js missing');
}
firebase.initializeApp(CFG.firebase);
const auth = firebase.auth();
const db = firebase.firestore();
let unsubs = [];
let dataOn = false;

/* ---------- sign in ---------- */
auth.onAuthStateChanged(u => {
  unsubs.forEach(f => f()); unsubs = []; dataOn = false; cvCardsOn = false; S.cvStaff = []; S.cvCards = {}; S.cvLoaded = false;
  S.user = u; S.email = u && u.email ? u.email.toLowerCase() : ''; S.owner = !!u && u.emailVerified && S.email === OWNER; S.viewer = !!u && S.email === VIEWER;
  S.member = !!u && isStaffEmail(S.email); S.login = S.member ? S.email.slice(8, S.email.indexOf('@')) : '';
  S.cvConvs = {}; S.cvRegs = {}; S.cvRegsLoaded = false; S.visits = null; S.visitsOn = false; visitSent = false; S.cvLogins = null; S.profile = null; S.profileLoaded = false; S.stCards = {};
  S.team = {}; S.attendance = {}; S.notes = []; S.loaded = false; S.me = null;
  if (u && (u.emailVerified || S.viewer || S.member)) listen();
  render();
});

function listen(){
  const fail = e => { console.warn(e); if (e.code === 'permission-denied') { S.loaded = true; render(); } };
  if (S.viewer || S.member) S.loaded = true;
  else if (S.owner) {
    unsubs.push(db.collection('team').onSnapshot(s => { S.team = {}; s.forEach(d => S.team[d.id] = d.data()); S.loaded = true; render(); }, fail));
  } else {
    unsubs.push(db.collection('team').doc(S.email).onSnapshot(d => {
      S.me = d.exists ? d.data() : null; S.loaded = true;
      if (S.me && S.me.active && !dataOn) listenTeamData();
      if (!(S.me && S.me.active)) dataOn = false;
      render();
    }, fail));
  }
  if (S.owner) listenTeamData();
  // the shared login reads only the convoy days (who was selected), never the full staff list
  if (S.viewer) { S.cvLoaded = true; cvListenInfo(); }
  // a staff member reads their own name card, the convoys and who registered
  if (S.member) { S.cvLoaded = true; cvListenInfo(); cvListenRegs();
    unsubs.push(db.collection('convoyLogins').doc(S.login).onSnapshot(d => { S.profile = d.exists ? d.data() : null; S.profileLoaded = true; visitLog(); render(); },
      e => { console.warn(e); S.profileLoaded = true; render(); })); }
  if (S.owner) {
    unsubs.push(db.collection('convoyStaff').orderBy('no').onSnapshot(s => { S.cvStaff = s.docs.filter(d => typeof d.data().no === 'number').map(d => ({key:d.id, ...d.data()})); S.cvLoaded = true; cvSecMigrate(); cvLoginsSync(false); cvApplyRegs(); cvGroupSync(); render(); }, e => { console.warn(e); S.cvLoaded = true; S.cvDenied = e.code === 'permission-denied'; render(); }));
    cvListenInfo(); cvListenRegs(); cvListenLogins();
  }
}
function cvListenInfo(){
  {
    unsubs.push(db.collection('convoyInfo').onSnapshot(s => {
      S.cvCars = []; let notice = null; const days = {}, convs = {}, notes = [], meta = {}, rank = {day: 3, saved: 2, trip: 1};
      // older records ("saved" trips and the two working trips) still show, a "day" record wins
      const put = (date, T, rec) => { if (!date || !TRIP[T]) return; const d = days[date] = days[date] || {};
        if (!d[T] || rank[rec.src] > rank[d[T].src]) d[T] = rec; };
      s.forEach(d => { const x = d.data();
        if (d.id === 'vehicles') S.cvCars = x.list || [];
        else if (d.id === 'current') S.cv = {date: x.date || '', direction: x.direction || ''};
        else if (d.id === 'sections') S.cvSecs = x.list || null;
        else if (x.kind === 'conv') convs[x.date] = x;
        else if (x.kind === 'meta') meta[x.date] = x;
        else if (d.id === 'escorts') S.cvEscorts = x.list || null;
        else if (d.id === 'group') S.cvGroup = x.list || [];
        else if (d.id === 'notice') notice = x.text ? x : null;
        else if (x.kind === 'cnote') notes.push({id: d.id, ...x});
        else if (x.kind === 'day') put(x.date, x.dir, {src: 'day', people: x.people || {}, drivers: x.drivers || {}, leader: x.leader || '', staff: x.staff, vehicles: x.vehicles});
        else if (x.kind === 'saved') { const people = {}, drivers = {}; (x.staff || []).forEach(p => people[p.key] = p.plate || ''); (x.vehicles || []).forEach(v => { if (v.driver) drivers[v.plate] = v.driver; });
          put(x.date, x.dir, {src: 'saved', people, drivers, staff: x.staff, vehicles: x.vehicles}); }
        else if (d.id === 'tripTO' || d.id === 'tripFROM') put(x.date, d.id.slice(4), {src: 'trip', people: x.people || {}, drivers: x.drivers || {}}); });
      S.cvDays = days; S.cvConvs = convs; S.cvMeta = meta; S.cvNotice = notice; S.cvNotes = notes.sort((a, b) => b.at - a.at); S.cvInfoLoaded = true; cvApplyRegs(); if (S.cvLoaded) cvGroupSync(); render(); }, e => { console.warn(e); S.cvInfoLoaded = true; render(); }));
  }
}
// ID card pictures are large, so they load only once the Convoy tab is opened
function cvBlobUrl(dataUrl){ const [head, b64] = dataUrl.split(','); const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([a], {type: (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg'})); }
function cvListenCards(){ if (cvCardsOn || !S.owner) return; cvCardsOn = true;
  unsubs.push(db.collection('convoyCards').onSnapshot(s => { s.docChanges().forEach(c => { const k = c.doc.id; if (S.cvCards[k]) URL.revokeObjectURL(S.cvCards[k]); delete S.cvCards[k];
    const img = c.type !== 'removed' && c.doc.data().img; if (img) S.cvCards[k] = cvBlobUrl(img); }); render(); }, e => console.warn(e))); }
function listenTeamData(){
  dataOn = true;
  const fail = e => console.warn(e);
  if (!S.owner) unsubs.push(db.collection('team').onSnapshot(s => { S.team = {}; s.forEach(d => S.team[d.id] = d.data()); render(); }, fail));
  unsubs.push(db.collection('attendance').onSnapshot(s => { S.attendance = {}; s.forEach(d => S.attendance[d.id] = d.data().marks || {}); render(); }, fail));
  let firstOrders = true;
  unsubs.push(db.collection('orders').orderBy('at','desc').limit(300).onSnapshot(s => {
    if (!firstOrders) s.docChanges().forEach(c => { const o = c.doc.data();
      if (c.type === 'added' && o.by !== S.email && !c.doc.metadata.hasPendingWrites) alertNew('New daily job', o.title + (o.location ? ' · ' + o.location : '')); });
    firstOrders = false;
    S.orders = s.docs.map(d => ({id:d.id, ...d.data()})); render(); refreshSheet(); }, fail));
  let firstSupport = true;
  unsubs.push(db.collection('support').orderBy('at','desc').limit(100).onSnapshot(s => {
    if (!firstSupport) s.docChanges().forEach(c => { const r = c.doc.data();
      if (c.type === 'added' && r.by !== S.email && !c.doc.metadata.hasPendingWrites) { alertNew('URGENT SUPPORT', (KIND[r.kind]||'Problem') + ' at ' + r.site + ' · ' + nameOf(r.by), true); beep(); } });
    firstSupport = false;
    S.support = s.docs.map(d => ({id:d.id, ...d.data()})); render(); refreshSheet(); }, fail));
  unsubs.push(db.collection('sites').onSnapshot(s => { S.sites = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => ((a.no||9999) - (b.no||9999)) || (a.name||'').localeCompare(b.name||'', undefined, {numeric:true})); render(); }, fail));
  unsubs.push(db.collection('readings').onSnapshot(s => { S.readings = {}; s.forEach(d => S.readings[d.id] = d.data().values || {}); render(); }, fail));
  unsubs.push(db.collection('notes').orderBy('at','desc').limit(300).onSnapshot(s => { S.notes = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fail));
}
const allowed = () => S.owner || S.viewer || S.member || !!(S.me && S.me.active);
const nameOf = e => (S.team[e] && S.team[e].name) || (e === OWNER ? 'Supervisor' : e);
const members = () => Object.entries(S.team).filter(([,t]) => t.active).map(([e,t]) => ({email:e, ...t})).sort((a,b) => (a.name||a.email).localeCompare(b.name||b.email));

/* ---------- render ---------- */
function typing(){ const a=document.activeElement; return a && a.closest('#view') && /^(INPUT|TEXTAREA)$/.test(a.tagName) && !/^(checkbox|radio|file|select-one)$/.test(a.type); }
let pending=false;
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) { pending=false; render(); } }, 0));
function fitAtt(){ const el = document.querySelector('.attwrap'); if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY; el.style.maxHeight = Math.max(280, window.innerHeight - top - 16) + 'px'; }
window.addEventListener('resize', fitAtt);
function render(){
  document.title = 'Critical Staff';
  if (typing()) { pending = true; return; }
  const ok = S.user && (S.user.emailVerified || S.viewer || S.member) && S.loaded && allowed();
  $('#me').innerHTML = S.user ? `<div>${esc(S.owner ? 'Elias FARAH · Admin' : S.viewer ? 'Staff · view only' : S.member ? (S.profile && S.profile.name) || S.login.toUpperCase() : (S.me && S.me.name) || S.email)}</div><button data-act="signout">Sign out</button>` : '';
  const tabs = S.viewer || S.member ? TABS.filter(([k]) => k === 'convoy') : TABS.filter(([k]) => !OWNER_TABS.includes(k) || S.owner);
  if (S.user && S.loaded && !tabs.some(([k]) => k === S.tab)) S.tab = tabs[0][0];
  $('#tabs').innerHTML = ok && !S.member ? tabs.map(([k,l]) => `<button class="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${k==='orders'&&newCount()?`<span class="dot">${newCount()}</span>`:''}${k==='support'&&openSupport().length?`<span class="dot red">${openSupport().length}</span>`:''}</button>`).join('') : '';
  const v = $('#view'); v.classList.toggle('wide', S.tab === 'attendance'); document.body.classList.toggle('full', !!((S.owner && (S.tab === 'convoy' || S.tab === 'notes')) || (S.member && S.tab === 'convoy'))); const sx = v.querySelector('.scrollx')?.scrollLeft;
  if (!S.user) v.innerHTML = authView();
  else if (!S.user.emailVerified && !S.viewer && !S.member) v.innerHTML = verifyView();
  else if (!S.loaded) v.innerHTML = `<div class="empty"><b>Loading</b>Checking your access.</div>`;
  else if (!allowed()) v.innerHTML = `<div class="gate stack"><h2>${S.me ? 'Access removed' : 'Not approved yet'}</h2><p class="muted">${S.me ? 'The supervisor has removed your access.' : 'Ask the supervisor to add <b>'+esc(S.email)+'</b> to the team. This page opens as soon as they do.'}</p></div>`;
  else v.innerHTML = ({orders:ordersView, support:supportView, kwh:kwhView, attendance:attView, notes:notesView, visits:visitsView, convoy:S.member ? regView : convoyView, team:teamView})[S.tab]();
  if (S.tab === 'convoy') cvListenCards();
  fitAtt();
  if (sx) { const el = v.querySelector('.scrollx'); if (el) el.scrollLeft = sx; }
}

function authView(){
  const up = S.authMode === 'signup';
  return `<form class="gate card stack" id="fAuth"><h2>${up ? 'Create your account' : 'Sign in'}</h2>
  ${!up && S.regDate ? `<div class="regbox small"><b>Convoy ${fmtD(S.regDate)}</b><br>Sign in to register for this convoy.</div>` : ''}
  <p class="muted small" style="margin:0">${up ? 'Use the work email your supervisor added to the team.' : 'Staff: your ID number, for example <b>CIV228370</b>. Password: the numbers of your ID, for example <b>228370</b>.'}</p>
  <label class="f">${up ? 'Email' : 'ID number or email'}<input id="aEmail" type="${up ? 'email' : 'text'}" autocomplete="username" autocapitalize="none" placeholder="${up ? '' : 'CIV228370'}" required></label>
  <label class="f">Password<input id="aPass" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required></label>
  ${S.authMsg ? `<div class="${S.authMsg.startsWith('✓')?'ok':'err'}">${esc(S.authMsg)}</div>` : ''}
  <button class="btn primary" type="submit">${up ? 'Create account' : 'Sign in'}</button>
  <div class="row small"><button class="btn ghost sm" type="button" data-act="authMode">${up ? 'I already have an account' : 'First time here? Create an account'}</button>
  ${up ? '' : '<span class="spacer"></span><button class="btn ghost sm" type="button" data-act="forgot">Forgot password</button>'}</div></form>`;
}
function verifyView(){

function attXlsx(btn){

    const ws = wb.addWorksheet(ymLabel(m), {pageSetup: {orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: {left: .3, right: .3, top: .4, bottom: .4, header: .2, footer: .2}},

    ws.getCell(1, 1).font = {bold: true, size: 15, color: {argb: 'FF1F1F1F'}};
    ws.mergeCells(2, 1, 2, last); ws.getCell(2, 1).value = ymLabel(m) + '   ·   ' + rows.length + ' electrician' + (rows.length === 1 ? '' : 's');
    ws.getCell(2, 1).font = {size: 11, color: {argb: 'FF595959'}};
    ws.getRow(3).height = 6;
    const h1 = ws.getRow(4), h2 = ws.getRow(5);
    h1.values = ['No', 'Name', ...[...Array(n)].map((_, i) => i + 1), ...totals];
    h2.values = ['', '', ...[...Array(n)].map((_, i) => 'SMTWTFS'[dow(i + 1)]), ...totals.map(() => '')];
    ws.mergeCells(4, 1, 5, 1); ws.mergeCells(4, 2, 5, 2); totals.forEach((_, i) => ws.mergeCells(4, 3 + n + i, 5, 3 + n + i));
    [h1, h2].forEach(r => { r.height = 18; for (let c = 1; c <= last; c++) { const cell = r.getCell(c);
      const d = c - 2, isDay = d >= 1 && d <= n, isTot = c > 2 + n;
      cell.font = {bold: true, size: 10, color: {argb: 'FFFFFFFF'}}; cell.alignment = {horizontal: c === 2 ? 'left' : 'center', vertical: 'middle'};
      cell.fill = fill(isTot ? COL[totals[c - 3 - n]][1] : (isDay && we(d) ? '595959' : '1F3864')); cell.border = border; } });
    rows.forEach((e, i) => { const mk = marks[e] || {}; const cnt = k => Object.values(mk).filter(v => v === k).length;
      const r = ws.addRow([i + 1, nameOf(e), ...[...Array(n)].map((_, d) => mk[d + 1] || ''), ...totals.map(cnt)]); r.height = 18;
      for (let c = 1; c <= last; c++) { const cell = r.getCell(c), d = c - 2, v = cell.value;
        cell.border = border; cell.alignment = {horizontal: c === 2 ? 'left' : 'center', vertical: 'middle'}; cell.font = {size: 10};
        if (d >= 1 && d <= n) { if (COL[v]) { cell.fill = fill(COL[v][0]); cell.font = {size: 10, bold: true, color: {argb: 'FF' + COL[v][1]}}; } else if (we(d)) cell.fill = fill('F2F2F2'); }
        else if (c > 2 + n) { cell.font = {size: 10, bold: true}; cell.fill = fill('F7F7F7'); }
        else if (c === 2) cell.font = {size: 10, bold: true}; } });
    ws.addRow([]);
    const lg = ws.addRow(['', 'Legend']); lg.getCell(2).font = {bold: true, size: 10};
    MARKS.forEach(([k, l]) => { const r = ws.addRow(['', l]); const c = r.getCell(3); c.value = k; c.fill = fill(COL[k][0]); c.font = {bold: true, size: 10, color: {argb: 'FF' + COL[k][1]}}; c.alignment = {horizontal: 'center'}; c.border = border; r.getCell(2).font = {size: 10}; });
    ws.addRow([]);

    a.download = 'Attendance ' + ymLabel(m) + '.xlsx'; document.body.appendChild(a); a.click(); a.remove();
  }).catch(err => { console.warn(err); toast('Could not create the Excel file. Check your connection and try again.'); })
    .finally(() => { btn.disabled = false; btn.textContent = label; });
}

const TRIP = {TO: {name: 'To Naqoura', route: 'Sector West → UNIFIL HQ Naqoura'}, FROM: {name: 'From Naqoura', route: 'UNIFIL HQ Naqoura → Sector West'}};

const ESCORTS = ['IRISHBATT', 'GHANBATT', 'ITALBATT'];
const ESCORT_NAME = {IRISHBATT: 'Irish contingent (IRISHBATT)', GHANBATT: 'Ghanaian contingent (GHANBATT)', ITALBATT: 'Italian contingent (ITALBATT)'};
const escortOf = date => ((S.cvMeta || {})[date] || {}).escort || 'IRISHBATT';
const escortName = date => ESCORT_NAME[escortOf(date)] || escortOf(date);
const escortList = () => { const l = (S.cvEscorts || ESCORTS).slice(); Object.values(S.cvMeta || {}).forEach(m => { if (m.escort && !l.includes(m.escort)) l.push(m.escort); }); return l; };
// a convoy exists once it was created, has a list, or has registration open
const isConvoy = date => !!(S.cvMeta[date] || S.cvConvs[date] || hasList(date));

/* --- 1. Rotation: who went To Naqoura last convoy comes back From Naqoura, and the other way round --- */
const lastConvoy = before => Object.keys(S.cvDays).filter(d => d < before && hasList(d)).sort().pop() || '';
function cvRotation(){ const T = cvT(), other = T === 'TO' ? 'FROM' : 'TO', last = lastConvoy(S.cvDate);
  if (!last) { toast('No earlier convoy to copy from'); return; }
  const src = recOf(last, other), people = {...tripOf(T).people}; let n = 0;
  Object.keys(src.people).forEach(k => { if (S.cvStaff.some(s => s.key === k) && typeof people[k] !== 'string') { people[k] = src.people[k] || ''; n++; } });
  if (!n) { toast('Everyone from ' + TRIP[other].name + ' on ' + fmtD(last) + ' is already on this list'); return; }
  tripSet(T, {people}); toast(n + ' staff added: they were ' + TRIP[other].name + ' on ' + fmtD(last) + ', with the same cars'); }
/* --- 2. Checks before sending the list --- */
function cvChecks(T){ const out = [], staff = tripStaff(T);
  const noCar = cvNoCar(T); if (noCar.length) out.push(noCar.length + ' without a car: ' + noCar.map(s => s.name).join(', '));
  cvPlates().forEach(c => { const n = cvInCar(T, c.plate).length; if (!n) return;
    if (!driverOf(T, c.plate)) out.push(c.plate + ' has no driver');
    if (c.seats && n > c.seats) out.push(c.plate + ' is over full: ' + n + ' people, ' + c.seats + ' seats'); });
  [['phone', 'phone'], ['idNo', 'ID number'], ['email', 'email']].forEach(([k, l]) => { const m = staff.filter(s => !String(s[k] || '').trim()); if (m.length) out.push('No ' + l + ': ' + m.map(s => s.name).join(', ')); });
  const noCard = staff.filter(s => !s.hasImg); if (noCard.length) out.push('No ID card picture: ' + noCard.map(s => s.name).join(', '));
  return out; }

  if (a === 'cvRepOpen') { S.cvRepMonth = S.cvDate.slice(0, 7); openSheet(cvReportSheet(), null, 'convoy'); }
  if (a === 'cvRepMonth') { const [y, m] = (S.cvRepMonth || S.cvDate.slice(0, 7)).split('-').map(Number); S.cvRepMonth = isoDay(new Date(y, m - 1 + Number(t.dataset.v), 1)).slice(0, 7); $('#panel').innerHTML = cvReportSheet(); }
  if (a === 'cvReport') cvReport();
  if (a === 'cvDelete') { if (t.dataset.confirm) cvDeleteConvoy(S.cvDate); else { t.dataset.confirm = 1; t.textContent = 'Tap again to delete this convoy'; t.classList.add('danger'); } }
  if (a === 'cvDay') { const d = t.dataset.v;
    if (S.cvPick && d < isoDay(new Date())) { toast('Choose today or a later date for a new convoy'); return; }
    S.cvDate = d; S.cvMonth = d.slice(0, 7);
    if (S.cvPick) { S.cvPick = false; if (!S.cvMeta[d]) cvSetEscort(d, 'IRISHBATT'); render(); toast('Convoy ' + fmtD(d) + ': open registration, then tick the staff'); const el = document.querySelector('#regClose'); if (el) el.closest('.regbox').scrollIntoView({block: 'nearest', behavior: 'smooth'}); return; }
    render(); }
  if (a === 'cvMonth') { const [y, m] = S.cvMonth.split('-').map(Number); S.cvMonth = isoDay(new Date(y, m - 1 + Number(t.dataset.v), 1)).slice(0, 7); render(); }
  if (a === 'cvCar') openSheet(cvCarSheet(t.dataset.plate), null, 'convoy');
  if (a === 'cvCarNew') openSheet(cvCarForm(null), null, 'convoy');
  if (a === 'cvCarEdit') openSheet(cvCarForm(cvPlates().find(c => c.plate === t.dataset.plate)), null, 'convoy');
  if (a === 'cvCarDel') { if (t.dataset.confirm) cvCarDel(t.dataset.plate); else { t.dataset.confirm = 1; t.textContent = 'Tap again to remove'; t.classList.add('danger'); } }
});
function authError(err){
  const c = err && err.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'ID number or password is wrong. Staff: the password is the numbers of your ID.';
  if (c.includes('email-already-in-use')) return 'This email already has an account. Sign in instead.';
  if (c.includes('weak-password')) return 'Use a password with at least 6 characters.';
  if (c.includes('invalid-email')) return 'That email address is not valid.';
  if (c.includes('too-many-requests')) return 'Too many tries. Wait a few minutes and try again.';
  return 'Something went wrong. Check your connection and try again.';
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cvtick) { const s = S.cvStaff.find(x => x.key === t.dataset.cvtick), nm = s ? s.name : 'this person', T = cvT();
    const key = t.dataset.cvtick, want = t.checked; t.checked = !want;
    askYesNo(want ? 'Add to the list?' : 'Remove from the list?', `<b>${esc(nm)}</b> ${want ? 'to' : 'from'} ${TRIP[T].name} on ${fmtD(S.cvDate)}`, !want).then(y => { if (y) { t.checked = want; cvTick(key, want); } }); return; }
  if (t.id === 'cvSec' && t.value === '__new') { const sel = t; cvNewSection().then(n => { sel.innerHTML = cvSecOptions(n || (cvEditing ? secOf(cvEditing) : 'ELECT.UNIT')); }); return; }
  if (t.dataset.cvcar) { cvPick(t.dataset.cvcar, t.value); return; }
  if (t.id === 'mlDate') { S.mlDate = t.value; render(); return; }
  if (t.id === 'cvEscort') { const date = S.cvDate; if (t.value === '__new') cvNewEscort().then(n => n ? cvSetEscort(date, n) : render()); else cvSetEscort(date, t.value); return; }
  if (t.id === 'iscrFile') { const f = t.files && t.files[0]; t.value = ''; if (f) iscrLoad(f); return; }
  if (t.id === 'iscrLeader') { tripSet(cvT(), {leader: t.value}); return; }
  if (t.id === 'cvImport') { const f = t.files && t.files[0]; t.value = ''; if (f) cvImport(f); return; }
  if (t.id === 'cvFile') { const f = t.files && t.files[0]; t.value = ''; if (f) cvNormalise(f).then(d => { cvPending = d; $('#cvPrev').innerHTML = `<img alt="" src="${d}">`; $('#cvFormMsg').textContent = ''; })
      .catch(() => { $('#cvFormMsg').textContent = 'That file could not be read as a picture. Choose a JPG or PNG photo of the card.'; }); return; }
  if (t.dataset.kwh) { const raw = t.value.replace(/[\s,]/g, ''), id = t.dataset.kwh, m = S.kMonth;
    if (raw !== '' && isNaN(Number(raw))) { toast('Type numbers only'); return; }
    S.readings[m] = {...(S.readings[m] || {})}; if (raw === '') delete S.readings[m][id]; else S.readings[m][id] = {v: Number(raw), by: S.email, at: Date.now()};
    kwhLive();
    const ref = db.collection('readings').doc(m);
    const p = raw === '' ? ref.set({values: {[id]: firebase.firestore.FieldValue.delete()}}, {merge: true})
      : ref.set({values: {[id]: {v: Number(raw), by: S.email, at: Date.now()}}}, {merge: true});
    p.then(() => { t.classList.toggle('done', raw !== ''); }).catch(failed); return; }
  if (t.id !== 'dAs') return;
  db.collection('orders').doc(t.dataset.id).update({assignee: t.value || null, updatedAt: Date.now(), ...logEntry({text: t.value ? 'Assigned to ' + nameOf(t.value) : 'Unassigned'})}).catch(failed);
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'fCv') cvSave();
  if (f.id === 'fCar') cvCarSave();
  if (f.id === 'fReg') regSubmit();
  if (f.id === 'fRegEdit') { const ms = new Date(val('regClose2')).getTime(); if (!ms) return;
    db.collection('convoyInfo').doc('conv_' + S.cvDate).update({closesAt: ms}).then(() => { toast(ms > Date.now() ? 'Open until ' + fmtWhen(ms) : 'Registration closed'); closeSheet(); }).catch(failed); }
  if (f.id === 'fAuth') { const em = loginEmail(val('aEmail')), pw = loginPass(val('aEmail'), $('#aPass').value);
    const p = S.authMode === 'signup'
      ? auth.createUserWithEmailAndPassword(em, pw).then(c => c.user.sendEmailVerification())
      : auth.signInWithEmailAndPassword(em, pw);
    p.then(() => { S.authMsg = ''; }).catch(err => { S.authMsg = authError(err); render(); }); }
  if (f.id === 'fSLog') { const txt = val('sLogText'); if (!txt) return; const k = 'l' + Date.now().toString(36);
    db.collection('support').doc(f.dataset.id).update(new firebase.firestore.FieldPath('log', k), {by: S.email, at: Date.now(), text: txt}).then(() => { const i = $('#sLogText'); if (i) i.value = ''; }).catch(failed); }
  if (f.id === 'fSupport') { remember('eu.phone', val('sPhone')); const val0 = {kind: val('sKind'), site: val('sSite'), details: val('sDet'), phone: val('sPhone')};
    db.collection('support').add({kind: val('sKind'), site: val('sSite'), details: val('sDet'), phone: val('sPhone'), status: 'open', responders: {}, log: {['l' + Date.now().toString(36)]: {by: S.email, at: Date.now(), status: 'open', text: 'Request sent'}}, by: S.email, at: firebase.firestore.FieldValue.serverTimestamp()})
      .then(() => { toast('Urgent support request sent to everyone', true); notifyPhones('New urgent support request', true); }).catch(failed);
    closeSheet(); }
  if (f.id === 'fOrder') { const as = val('oAs') || null; const job = {title: val('oTitle'), location: val('oLoc'), client: val('oClient'), priority: val('oPri'), assignee: as};
    const k = 'l' + Date.now().toString(36);
    db.collection('orders').add({title: val('oTitle'), client: val('oClient'), location: val('oLoc'), priority: val('oPri'), assignee: as, details: val('oDet'),
      status: 'new', by: S.email, at: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: Date.now(),
      log: {[k]: {by: S.email, at: Date.now(), status: 'new', text: 'Job logged' + (as ? ', assigned to ' + nameOf(as) : '')}}})
      .then(() => { toast('Job sent to the team'); notifyPhones(job.priority === 'high' ? 'New urgent client job' : 'New daily job', job.priority === 'high'); }).catch(failed);
    closeSheet(); }
  if (f.id === 'fLog') { const txt = val('logText'); if (!txt) return;
    db.collection('orders').doc(f.dataset.id).update({updatedAt: Date.now(), ...logEntry({text: txt})}).then(() => { const i = $('#logText'); if (i) i.value = ''; }).catch(failed); }
  if (f.id === 'fNotice') { const text = val('ncText'), showClose = !!($('#ncClose') || {}).checked; if (!S.owner) return; if (!text && !showClose) { toast('Write the notice first'); return; }
    db.collection('convoyInfo').doc('notice').set({kind: 'notice', text: text || ' ', showClose, at: Date.now()}).then(() => toast('✓ Notice is showing to all staff')).catch(failed); return; }
  if (f.id === 'fNote') { const txt = val('nText'), topic = val('nTopic'); if (!txt || !S.owner) return; if (e.submitter && e.submitter.dataset.mail) mailStaff(topic, txt);
    const at = Date.now(); db.collection('convoyInfo').doc('note_' + at).set({kind: 'cnote', topic, text: txt, at})
      .then(() => { toast('Note shared'); const a = $('#nText'), b = $('#nTopic'); if (a) a.value = ''; if (b) b.value = ''; a && a.blur(); }).catch(failed); }
  if (f.id === 'fSites') { const have = new Set(S.sites.map(x => x.name.toLowerCase())); let no = Math.max(0, ...S.sites.map(x => x.no || 0));
    const isNum = x => x !== '' && !isNaN(Number(x.replace(/[\s,]/g, '')));
    const list = val('kSites').split(/\r?\n/).map(l => l.split('\t').map(x => x.trim()).filter(Boolean)).filter(c => c.length).map(c => {
      if (c.length > 1 && isNum(c[0]) && !isNum(c[1])) c = c.slice(1);
      const last = c.length > 1 && isNum(c[c.length - 1]) ? Number(c.pop().replace(/[\s,]/g, '')) : null;
      return {name: c.join(' ').replace(/\s+/g, ' ').trim(), last}; }).filter(x => x.name && !/^(no\s+)?(location|site)\b/i.test(x.name) && !have.has(x.name.toLowerCase()) && (have.add(x.name.toLowerCase()), true));
    if (!list.length) { toast('Those sites are already in the list'); return; }
    const pm = shiftYm(ym(new Date()), -1), b = db.batch(), vals = {};
    list.forEach(x => { const ref = db.collection('sites').doc(); b.set(ref, {name: x.name, no: ++no, meter: '', at: Date.now()}); if (x.last !== null) vals[ref.id] = {v: x.last, by: S.email, at: Date.now()}; });
    if (Object.keys(vals).length) b.set(db.collection('readings').doc(pm), {values: vals}, {merge: true});
    b.commit().then(() => { toast(list.length + ' site' + (list.length>1?'s':'') + ' added'); const i = $('#kSites'); if (i) { i.value = ''; i.blur(); } }).catch(failed); }
  if (f.id === 'fAdd') { const em = val('tEmail').toLowerCase(), nm = val('tName'); if (!em) return;
    db.collection('team').doc(em).set({name: nm, email: em, active: true, addedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge: true})
      .then(() => { toast(nm + ' added'); $('#tEmail').value = ''; $('#tName').value = ''; $('#tName').blur(); }).catch(failed); }
});
